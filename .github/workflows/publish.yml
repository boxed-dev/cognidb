name: Publish to PyPI

# Publishes to PyPI via Trusted Publishing (OIDC) — no long-lived API token is
# stored. Configure the trusted publisher once on PyPI (Project → Publishing):
#   Owner: boxed-dev   Repository: cognidb
#   Workflow: publish.yml   Environment: pypi
# Then publishing a GitHub Release (tag vX.Y.Z) builds and uploads that version.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Verify metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
